name: ci

on:
  push:
  pull_request:

jobs:
  # macOS and Windows have no fontconfig, so these runs prove the embedded fonts alone carry
  # every example; the e2e suite builds each one.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # Solver checks are deterministic, so they gate on any machine; time is only reported.
      - run: python3 scripts/bench.py --runs 1 --check bench/baseline.tsv

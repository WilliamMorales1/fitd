name: ci

on:
  push:
  pull_request:

jobs:
  # macOS and Windows have no fontconfig, so these runs prove the embedded fonts alone carry
  # every example; the e2e suite builds each one.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  tree-sitter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter-fitd
    steps:
      - uses: actions/checkout@v5
      - run: npx --yes tree-sitter-cli@0.26.9 generate && git diff --exit-code src
      - run: npx --yes tree-sitter-cli@0.26.9 test -p .
      # Every example and fixture parses without an error node.
      - run: "! npx --yes tree-sitter-cli@0.26.9 parse -p . -q ../../examples/*.fitd ../../tests/fixtures/*.fitd | grep -E 'ERROR|MISSING'"

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # Solver checks are deterministic, so they gate on any machine; time is only reported.
      - run: python3 bench/bench.py --runs 1 --check bench/baseline.tsv

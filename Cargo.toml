[package]
name = "fitd"
version = "0.1.0"
edition = "2024"
description = "Constraint-diagram compiler: concept maps and flowcharts laid out by a CSP solver, with rustc-style diagnostics"

[dependencies]
resvg = { version = "0.49.0", default-features = false, features = ["text"] }
ttf-parser = "0.25"

[profile.dev]
opt-level = 1

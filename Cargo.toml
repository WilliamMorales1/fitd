[package]
name = "fitd"
version = "0.1.0"
edition = "2024"
description = "Constraint-diagram compiler: concept maps and flowcharts laid out by a CSP solver, with rustc-style diagnostics"

[features]
default = ["embedded-fonts"]
# Built-in DejaVu Serif and DejaVu Math TeX Gyre; without it, fonts come from fc-match.
embedded-fonts = []

[dependencies]
krilla = { version = "0.8.2", default-features = false }
krilla-svg = "0.8.1"
# krilla-svg reads trees from this usvg, older than the one resvg uses for PNG.
usvg-pdf = { package = "usvg", version = "0.47.0", default-features = false, features = ["text"] }
resvg = { version = "0.49.0", default-features = false, features = ["text"] }
serde_json = "1"
ttf-parser = "0.25"

[profile.dev]
opt-level = 1
